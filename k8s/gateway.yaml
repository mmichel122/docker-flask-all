apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flask-api-gateway
  namespace: demo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: alb
  listeners:
  - name: http
    protocol: HTTP
    port: 80

